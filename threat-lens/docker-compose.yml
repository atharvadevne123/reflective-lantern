version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://threatuser:threatpass@db:5432/threatlens
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - model_data:/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threatuser
      POSTGRES_PASSWORD: threatpass
      POSTGRES_DB: threatlens
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatuser -d threatlens"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  pg_data:
  model_data:
