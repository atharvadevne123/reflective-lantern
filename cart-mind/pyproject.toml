[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cart-mind"
version = "1.0.0"
description = "Real-time product recommendation and purchase intent prediction API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.0",
    "lightgbm>=4.5.0",
    "xgboost>=2.1.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "joblib>=1.4.0",
    "faiss-cpu>=1.9.0",
]

[tool.setuptools.packages.find]
include = ["app*", "pipelines*"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0", "ruff>=0.9.0", "httpx>=0.27.0"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
