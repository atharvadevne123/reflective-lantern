version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cyber:guard@db:5432/cyberguard
      - MODEL_PATH=/app/model.joblib
      - METRICS_PATH=/app/metrics.json
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - model_data:/app

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=cyber
      - POSTGRES_PASSWORD=guard
      - POSTGRES_DB=cyberguard
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber -d cyberguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  pg_data:
  model_data:
