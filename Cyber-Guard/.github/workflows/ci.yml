name: Cyber-Guard CI

on:
  push:
    branches: [main, cyber-guard-innovation]
    paths:
      - 'Cyber-Guard/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'Cyber-Guard/**'

defaults:
  run:
    working-directory: Cyber-Guard

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Cyber-Guard/requirements.txt
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: "sqlite:///./test_cyber_guard.db"
      MODEL_PATH: "/tmp/test_model.joblib"
      METRICS_PATH: "/tmp/test_metrics.json"
      ANOMALY_MODEL_PATH: "/tmp/test_anomaly.joblib"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Cyber-Guard/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short

  migrations:
    name: Alembic migrations
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: "sqlite:///./migration_check.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Cyber-Guard/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      # A migration that cannot be reversed is a migration that cannot be
      # rolled back in production, so both directions are exercised.
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade to base
        run: alembic downgrade base

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cyber-guard:ci .
