name: Cyber-Guard CI

on:
  push:
    branches: [main, cyber-guard-innovation]
    paths:
      - 'Cyber-Guard/**'
  pull_request:
    branches: [main]
    paths:
      - 'Cyber-Guard/**'

defaults:
  run:
    working-directory: Cyber-Guard

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short 2>&1
        env:
          DATABASE_URL: "sqlite:///./test_cyber_guard.db"
          MODEL_PATH: "/tmp/test_model.joblib"
          METRICS_PATH: "/tmp/test_metrics.json"
