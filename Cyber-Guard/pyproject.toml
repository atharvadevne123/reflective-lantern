[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "pipelines", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# N803/N806: `X`/`y` for feature matrices is the sklearn convention.
ignore = ["E501", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipelines", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cyber-guard"
version = "1.0.0"
description = "Real-time network intrusion detection and cybersecurity threat classification API"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Reflective Lantern", email = "devneatharva@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
