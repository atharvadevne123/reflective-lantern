version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://support_sage:password@db:5432/support_sage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - models_data:/app/models
      - rag_data:/app/rag_index

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: support_sage
      POSTGRES_PASSWORD: password
      POSTGRES_DB: support_sage
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_sage"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  models_data:
  rag_data:
  pg_data:
