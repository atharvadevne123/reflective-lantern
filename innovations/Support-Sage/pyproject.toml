[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "support-sage"
version = "1.0.0"
description = "IT helpdesk ticket triage API with ML ensemble and FAISS retrieval"
requires-python = ">=3.11"
authors = [{ name = "Reflective Lantern", email = "devneatharva@gmail.com" }]
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
