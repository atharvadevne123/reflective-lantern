[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-rag"
version = "1.0.0"
description = "Near-zero-hallucination RAG: hybrid retrieval, trust scoring, constrained cited generation"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Reflective Lantern", email = "devneatharva@gmail.com" }]
keywords = ["rag", "retrieval", "hallucination", "citations", "bm25", "faiss", "trust-scoring"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.2",
    "numpy>=1.26.4",
    "pypdf>=5.1.0",
]

[project.optional-dependencies]
ann = ["faiss-cpu>=1.9.0"]
llm = ["anthropic>=0.40.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
