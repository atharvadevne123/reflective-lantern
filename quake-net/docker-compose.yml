version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://quake_user:quake_pass@db:5432/quake_net
      MODEL_PATH: /app/model.joblib
      METRICS_PATH: /app/metrics.json
      REFERENCE_PATH: /app/reference_dist.json
      DRIFT_WINDOW: "200"
      DRIFT_ALPHA: "0.05"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_data:/app/model_artifacts
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quake_user
      POSTGRES_PASSWORD: quake_pass
      POSTGRES_DB: quake_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quake_user -d quake_net"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  model_data:
