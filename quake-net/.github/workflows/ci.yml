name: Quake-Net CI

on:
  push:
    branches: ["**"]
    paths:
      - "quake-net/**"
  pull_request:
    branches: ["main"]
    paths:
      - "quake-net/**"

defaults:
  run:
    working-directory: quake-net

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov httpx
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing 2>&1 | tail -80
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: quake-net/.coverage
        if: always()

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build
          python -m build --sdist --wheel 2>&1 | tail -5
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quake-net-dist
          path: quake-net/dist/
