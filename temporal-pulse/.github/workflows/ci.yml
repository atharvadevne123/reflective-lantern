name: CI

on:
  push:
    branches: [main]
    paths:
      - "temporal-pulse/**"
  pull_request:
    branches: [main]
    paths:
      - "temporal-pulse/**"

defaults:
  run:
    working-directory: temporal-pulse

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: temporal-pulse/requirements.txt
      - run: pip install ruff
      - run: ruff check . --select E,F,W,I --ignore E501

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: temporal-pulse/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: |
          pip install pytest pytest-cov
          python -m pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-report=xml:coverage.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: temporal-pulse/coverage.xml

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: temporal-pulse/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt mypy
      - run: mypy app/ --ignore-missing-imports --no-strict-optional
