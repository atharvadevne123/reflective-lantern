version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://alphauser:alphapass@db:5432/alphascout
      - MODEL_VERSION=1.0.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_data:/app/model_data
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: alphascout
      POSTGRES_USER: alphauser
      POSTGRES_PASSWORD: alphapass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphauser -d alphascout"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  model_data:
