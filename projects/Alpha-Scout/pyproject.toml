[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "alpha-scout"
version = "1.0.0"
description = "ML-powered portfolio alpha generation and security scoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["machine-learning", "finance", "portfolio", "alpha", "xgboost", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "xgboost>=2.0.3",
    "scikit-learn>=1.4.2",
    "scipy>=1.13.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "joblib>=1.4.2",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.6", "httpx>=0.27.0", "ruff>=0.4.0"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "N803",
    "N806",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_diagram.py" = ["E501"]
"tests/test_api.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
