version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://newsguard:newsguard@db:5432/newsguard
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - model_data:/app/models

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newsguard
      POSTGRES_USER: newsguard
      POSTGRES_PASSWORD: newsguard
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsguard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  model_data:
