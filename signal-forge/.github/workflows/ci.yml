name: Signal-Forge CI

on:
  push:
    paths:
      - "signal-forge/**"
  pull_request:
    paths:
      - "signal-forge/**"

defaults:
  run:
    working-directory: signal-forge

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check . --select E,F,W,I --ignore E501

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
