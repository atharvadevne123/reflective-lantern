name: Energy-Seer CI

on:
  push:
    branches: ["**"]
    paths:
      - "energy_seer/**"
      - ".github/workflows/energy-seer-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "energy_seer/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: energy_seer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: energy_seer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest pytest-asyncio httpx -q

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v --tb=short 2>&1 | tail -60
