name: Publish Cyber-Guard Repo

# One-click publisher: creates the standalone Cyber-Guard repository and
# pushes the complete project history from the git bundle committed at
# pending/Cyber-Guard-2026-09-02.bundle, then creates a GitHub release for
# the v1.0.0 tag carried in the bundle.
#
# The build session could not create the repository itself: its gateway
# binds it to reflective-lantern and answers 403 to POST /user/repos, and
# rejects the GraphQL createRepository mutation as well. Actions runners
# reach api.github.com directly, so publishing works here with a PAT
# supplied at dispatch time.
#
# Publishing from the bundle preserves all 61 commits and the v1.0.0 tag
# exactly as they were built and verified.
#
# Trigger manually from the Actions tab, supplying a PAT with repo scope.

on:
  workflow_dispatch:
    inputs:
      gh_pat:
        description: 'GitHub PAT with repo scope (used once, not stored)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch holding the bundle
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create Cyber-Guard repository
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ github.event.inputs.gh_pat }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/user/repos \
            -d '{"name":"Cyber-Guard","description":"Real-time network intrusion detection and cybersecurity threat classification API using an XGBoost-RandomForest ensemble with KS-drift monitoring, IsolationForest anomaly detection, and automated retraining.","public":true,"auto_init":false}')
          echo "$RESPONSE" | python3 -c "import json,sys; r=json.load(sys.stdin); print(r.get('html_url', 'NOTE: ' + str(r.get('message',''))))"

      - name: Restore project from bundle
        run: |
          BUNDLE=pending/Cyber-Guard-2026-09-02.bundle
          git bundle verify "$BUNDLE"
          git clone "$BUNDLE" /tmp/Cyber-Guard
          cd /tmp/Cyber-Guard
          git config user.email "devneatharva@gmail.com"
          git config user.name "Reflective Lantern"
          echo "Commits restored: $(git log --oneline | wc -l)"
          echo "Tags restored: $(git tag -l | tr '\n' ' ')"

      - name: Push history and tags
        run: |
          cd /tmp/Cyber-Guard
          git remote remove origin 2>/dev/null || true
          git remote add origin \
            "https://x-access-token:${{ github.event.inputs.gh_pat }}@github.com/atharvadevne123/Cyber-Guard"
          git push origin main
          git push origin --tags

      - name: Create v1.0.0 release
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.event.inputs.gh_pat }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/atharvadevne123/Cyber-Guard/releases" \
            -d '{"tag_name":"v1.0.0","target_commitish":"main","name":"v1.0.0 — Initial Release","body":"Network intrusion detection and threat classification API.\n\nXGBoost + RandomForest ensemble over 15 engineered features, classifying connections into five threat classes. Includes KS-test drift monitoring, IsolationForest anomaly detection, an Airflow retraining DAG gated on accuracy, and Alembic migrations.\n\nMeasured on 5-fold stratified CV: accuracy 0.960 +/- 0.021, AUC-ROC 0.997 +/- 0.002.\n\n102 tests passing, ruff clean. See README for setup.","draft":false,"prerelease":false}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print('Release:', r.get('html_url','NOTE: '+str(r.get('message',''))))"

      - name: Verify published repository
        run: |
          # Confirm the push actually landed rather than trusting the exit code
          # of a command whose remote may have rejected the ref.
          curl -s -H "Authorization: Bearer ${{ github.event.inputs.gh_pat }}" \
            "https://api.github.com/repos/atharvadevne123/Cyber-Guard/commits?per_page=1" \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print('Head commit:', r[0]['sha'][:8] if isinstance(r,list) and r else 'NOT FOUND')"
