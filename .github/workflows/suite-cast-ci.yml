name: Suite-Cast CI

on:
  push:
    branches: ["innovation/suite-cast"]
    paths: ["suite-cast/**", ".github/workflows/suite-cast-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["suite-cast/**", ".github/workflows/suite-cast-ci.yml"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suite-cast

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: suite-cast/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run pytest
        run: pytest tests/ -q --tb=short

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
          ls -la dist/
