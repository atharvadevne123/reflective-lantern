name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: logistics-flow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name lf -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./logistics_flow.db \
            logistics-flow:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health; then break; fi
            sleep 2
          done

      - name: Smoke test
        run: python scripts/smoke_test.py --base-url http://localhost:8000

      - name: Container logs on failure
        if: failure()
        run: docker logs lf
