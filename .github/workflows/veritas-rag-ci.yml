name: Veritas-Rag CI

on:
  push:
    branches: ["innovation/veritas-rag"]
    paths: ["veritas-rag/**", ".github/workflows/veritas-rag-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["veritas-rag/**", ".github/workflows/veritas-rag-ci.yml"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veritas-rag

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: veritas-rag/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -q --tb=short

      - name: Evaluation gate (hallucination + adversarial)
        run: python scripts/run_eval.py

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
