name: Quake-Net CI

on:
  push:
    branches: ["innovation/quake-net"]
    paths: ["quake-net/**", ".github/workflows/quake-net-ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["quake-net/**", ".github/workflows/quake-net-ci.yml"]
  # Allow an on-demand run: the path filters above (correctly) skip this
  # workflow when a push touches nothing under quake-net/, such as a merge
  # from main, which leaves the PR head without a Quake-Net CI result.
  workflow_dispatch:

concurrency:
  group: quake-net-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: quake-net

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: quake-net/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov httpx
      - name: Seed drift reference distribution
        run: python3 scripts/bootstrap_reference.py --samples 500
      - name: Run tests
        run: pytest tests/ -q --tb=short 2>&1 | tail -40

  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build --sdist --wheel 2>&1 | tail -5
      - uses: actions/upload-artifact@v7
        with:
          name: quake-net-dist
          path: quake-net/dist/
