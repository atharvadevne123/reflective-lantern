name: Bootstrap Traffic-Pulse Repo

on:
  workflow_dispatch:
    inputs:
      gh_pat:
        description: 'GitHub PAT for repo creation'
        required: true
        type: string

jobs:
  create-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Create Traffic-Pulse repository
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ github.event.inputs.gh_pat }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/user/repos \
            -d '{"name":"Traffic-Pulse","description":"Real-time urban traffic congestion prediction and incident detection API using XGBoost-LightGBM ensemble with temporal features, route scoring, and automated drift detection.","public":true,"auto_init":false}')
          echo "Response: $RESPONSE"
          URL=$(echo "$RESPONSE" | python3 -c "import json,sys; r=json.load(sys.stdin); print(r.get('html_url', r.get('message','ERROR')))")
          echo "Repo URL: $URL"
