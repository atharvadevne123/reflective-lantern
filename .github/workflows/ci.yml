name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: logistics_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: sqlite:///./test.db
      MODEL_PATH: /tmp/model_ci.joblib
      METRICS_PATH: /tmp/metrics_ci.json

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing 2>&1 | tail -80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .pytest_cache/
