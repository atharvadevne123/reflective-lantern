name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ruff -q
      - run: ruff check . --select E,F,W,I --ignore E501

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]" -q 2>&1 | tail -5
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=config --cov=scripts --cov-report=xml
        env:
          ANTHROPIC_API_KEY: "sk-test"
          GH_PAT: "ghp_test"
          NOTION_API_KEY: "secret_test"
          GMAIL_USER: "test@example.com"
          GMAIL_APP_PASS: "test-pass"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  type-check:
    name: mypy
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]" -q 2>&1 | tail -5
      - name: Type check
        run: mypy config/ --ignore-missing-imports --no-error-summary 2>&1 | tail -20
