name: Volt-Cast CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v --tb=short 2>&1 | tail -60

      - name: Upload coverage
        if: always()
        run: |
          pip install pytest-cov -q
          pytest tests/ --cov=app --cov-report=term-missing 2>&1 | tail -30

      - name: Type check
        run: |
          pip install mypy -q
          mypy app/ --ignore-missing-imports --no-strict-optional 2>&1 | tail -10 || true
