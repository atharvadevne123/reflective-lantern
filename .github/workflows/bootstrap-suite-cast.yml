name: Publish Suite-Cast Repo

# One-click publisher: creates the standalone Suite-Cast repository and
# pushes the suite-cast/ project (from innovation/suite-cast, 61 commits)
# to it as main, then tags v1.0.0, creates a GitHub release, and uploads
# the built wheel as a release asset.
#
# Trigger manually from the Actions tab, supplying a PAT with repo scope.

on:
  workflow_dispatch:
    inputs:
      gh_pat:
        description: 'GitHub PAT with repo scope (used once, not stored)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create Suite-Cast repository
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ github.event.inputs.gh_pat }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/user/repos \
            -d '{"name":"Suite-Cast","description":"Hotel booking demand forecasting and dynamic pricing API using XGBoost-LightGBM ensemble with seasonality features, KS-test drift monitoring, SQLAlchemy prediction logging, and Docker deployment.","public":true,"auto_init":false}')
          echo "$RESPONSE" | python3 -c "import json,sys; r=json.load(sys.stdin); print(r.get('html_url', 'NOTE: ' + str(r.get('message',''))))"

      - name: Checkout innovation branch
        uses: actions/checkout@v4
        with:
          ref: innovation/suite-cast
          fetch-depth: 0

      - name: Export suite-cast subdirectory as repository root
        run: |
          git config user.email "devneatharva@gmail.com"
          git config user.name "Reflective Lantern"
          git subtree split --prefix=suite-cast -b suite-cast-export
          git push "https://x-access-token:${{ github.event.inputs.gh_pat }}@github.com/atharvadevne123/Suite-Cast" \
            suite-cast-export:refs/heads/main

      - name: Tag and release v1.0.0
        run: |
          git checkout suite-cast-export
          git tag -f v1.0.0
          git push -f "https://x-access-token:${{ github.event.inputs.gh_pat }}@github.com/atharvadevne123/Suite-Cast" v1.0.0
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.event.inputs.gh_pat }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/atharvadevne123/Suite-Cast/releases" \
            -d '{"tag_name":"v1.0.0","target_commitish":"main","name":"v1.0.0 — Initial Release","body":"Built by Reflective Lantern. Hotel booking demand forecasting and dynamic pricing API — XGBoost+LightGBM ensemble, 18 engineered features, KS-test drift detection, champion/challenger retraining, Docker+PostgreSQL, 100 tests. See README for setup.","draft":false,"prerelease":false}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print('Release:', r.get('html_url', r.get('message','')))"

      - name: Build and upload wheel asset
        run: |
          pip install build -q
          python -m build --wheel
          WHL=$(ls dist/*.whl | head -1)
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${{ github.event.inputs.gh_pat }}" \
            "https://api.github.com/repos/atharvadevne123/Suite-Cast/releases/tags/v1.0.0" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          if [ -n "$WHL" ] && [ -n "$RELEASE_ID" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${{ github.event.inputs.gh_pat }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$WHL" \
              "https://uploads.github.com/repos/atharvadevne123/Suite-Cast/releases/$RELEASE_ID/assets?name=$(basename $WHL)" \
              | python3 -c "import json,sys; r=json.load(sys.stdin); print('Asset:', r.get('browser_download_url','ERROR'))"
          fi
