[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "social-pulse"
version = "1.0.0"
description = "Viral social media content prediction API"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["__pycache__", ".venv", "venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
