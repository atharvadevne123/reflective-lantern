version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://social_pulse:social_pulse@db:5432/social_pulse
      - MODEL_VERSION=1.0.0
      - MODEL_DIR=/app/models
    volumes:
      - model_data:/app/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: social_pulse
      POSTGRES_USER: social_pulse
      POSTGRES_PASSWORD: social_pulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_pulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  model_data:
