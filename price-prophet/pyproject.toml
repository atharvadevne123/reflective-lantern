[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-prophet"
version = "1.0.0"
description = "ML-powered dynamic pricing optimisation for e-commerce"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.3",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "joblib>=1.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0", "ruff>=0.4.4"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = ["E501", "B008", "B017", "SIM108", "RUF012", "TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
