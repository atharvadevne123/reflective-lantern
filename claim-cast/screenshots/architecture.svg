<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" style="background:#0d1117;font-family:monospace">
  <text x="600" y="40" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Claim-Cast — System Architecture</text>
  <!-- Row 1: Client, API, XGBoost, IsolationForest -->
  <rect x="20" y="80" width="150" height="80" rx="8" fill="#1f6feb22" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="95" y="118" text-anchor="middle" fill="#1f6feb" font-size="13" font-weight="bold">Client</text>
  <text x="95" y="140" text-anchor="middle" fill="#8b949e" font-size="10">HTTP / JSON</text>
  <rect x="220" y="80" width="200" height="80" rx="8" fill="#3fb95022" stroke="#3fb950" stroke-width="1.5"/>
  <text x="320" y="110" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">FastAPI</text>
  <text x="320" y="128" text-anchor="middle" fill="#8b949e" font-size="9">/predict /health /metrics</text>
  <text x="320" y="145" text-anchor="middle" fill="#8b949e" font-size="9">/drift /premium /triage</text>
  <rect x="470" y="80" width="200" height="80" rx="8" fill="#d2992222" stroke="#d29922" stroke-width="1.5"/>
  <text x="570" y="110" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">XGBoost Pipeline</text>
  <text x="570" y="128" text-anchor="middle" fill="#8b949e" font-size="9">5-fold CV · 12 features</text>
  <text x="570" y="145" text-anchor="middle" fill="#8b949e" font-size="9">Actuarial engineering</text>
  <rect x="720" y="80" width="200" height="80" rx="8" fill="#d2992222" stroke="#d29922" stroke-width="1.5"/>
  <text x="820" y="110" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">Isolation Forest</text>
  <text x="820" y="128" text-anchor="middle" fill="#8b949e" font-size="9">Anomaly detection</text>
  <text x="820" y="145" text-anchor="middle" fill="#8b949e" font-size="9">Outlier claims</text>
  <rect x="970" y="80" width="200" height="80" rx="8" fill="#8957e522" stroke="#8957e5" stroke-width="1.5"/>
  <text x="1070" y="110" text-anchor="middle" fill="#8957e5" font-size="13" font-weight="bold">Premium Engine</text>
  <text x="1070" y="128" text-anchor="middle" fill="#8b949e" font-size="9">Risk multipliers</text>
  <text x="1070" y="145" text-anchor="middle" fill="#8b949e" font-size="9">Actuarial pricing</text>
  <!-- Row 2 -->
  <rect x="220" y="230" width="200" height="80" rx="8" fill="#8957e522" stroke="#8957e5" stroke-width="1.5"/>
  <text x="320" y="264" text-anchor="middle" fill="#8957e5" font-size="13" font-weight="bold">SQLAlchemy ORM</text>
  <text x="320" y="282" text-anchor="middle" fill="#8b949e" font-size="9">SQLite (dev)</text>
  <text x="320" y="299" text-anchor="middle" fill="#8b949e" font-size="9">PostgreSQL (prod)</text>
  <rect x="470" y="230" width="200" height="80" rx="8" fill="#f7816622" stroke="#f78166" stroke-width="1.5"/>
  <text x="570" y="264" text-anchor="middle" fill="#f78166" font-size="13" font-weight="bold">KS-Test Monitor</text>
  <text x="570" y="282" text-anchor="middle" fill="#8b949e" font-size="9">Drift detection</text>
  <text x="570" y="299" text-anchor="middle" fill="#8b949e" font-size="9">Prediction logging</text>
  <rect x="720" y="230" width="200" height="80" rx="8" fill="#58a6ff22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="820" y="264" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Retraining DAG</text>
  <text x="820" y="282" text-anchor="middle" fill="#8b949e" font-size="9">Airflow weekly</text>
  <text x="820" y="299" text-anchor="middle" fill="#8b949e" font-size="9">Model promotion</text>
  <!-- Row 3 -->
  <rect x="220" y="380" width="200" height="80" rx="8" fill="#8957e522" stroke="#8957e5" stroke-width="1.5"/>
  <text x="320" y="414" text-anchor="middle" fill="#8957e5" font-size="13" font-weight="bold">PostgreSQL</text>
  <text x="320" y="432" text-anchor="middle" fill="#8b949e" font-size="9">claim_predictions</text>
  <text x="320" y="449" text-anchor="middle" fill="#8b949e" font-size="9">drift_logs</text>
  <rect x="470" y="380" width="200" height="80" rx="8" fill="#3fb95022" stroke="#3fb950" stroke-width="1.5"/>
  <text x="570" y="414" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">Structlog</text>
  <text x="570" y="432" text-anchor="middle" fill="#8b949e" font-size="9">Correlation IDs</text>
  <text x="570" y="449" text-anchor="middle" fill="#8b949e" font-size="9">Rate limiting</text>
  <rect x="720" y="380" width="200" height="80" rx="8" fill="#58a6ff22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="820" y="414" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Docker + CI</text>
  <text x="820" y="432" text-anchor="middle" fill="#8b949e" font-size="9">docker-compose</text>
  <text x="820" y="449" text-anchor="middle" fill="#8b949e" font-size="9">GitHub Actions</text>
  <!-- Arrows row1 -->
  <line x1="170" y1="120" x2="218" y2="120" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="420" y1="120" x2="468" y2="120" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="670" y1="120" x2="718" y2="120" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Arrows row1->row2 -->
  <line x1="320" y1="160" x2="320" y2="228" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="570" y1="160" x2="570" y2="228" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="820" y1="160" x2="820" y2="228" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Arrows row2->row3 -->
  <line x1="320" y1="310" x2="320" y2="378" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="570" y1="310" x2="570" y2="378" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="820" y1="310" x2="820" y2="378" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Legend -->
  <text x="30" y="560" fill="#e6edf3" font-size="11">Legend:</text>
  <rect x="90" y="547" width="12" height="12" fill="#1f6feb44" stroke="#1f6feb"/>
  <text x="108" y="558" fill="#8b949e" font-size="10">Client</text>
  <rect x="160" y="547" width="12" height="12" fill="#3fb95044" stroke="#3fb950"/>
  <text x="178" y="558" fill="#8b949e" font-size="10">API Layer</text>
  <rect x="250" y="547" width="12" height="12" fill="#d2992244" stroke="#d29922"/>
  <text x="268" y="558" fill="#8b949e" font-size="10">ML Models</text>
  <rect x="340" y="547" width="12" height="12" fill="#8957e544" stroke="#8957e5"/>
  <text x="358" y="558" fill="#8b949e" font-size="10">Database</text>
  <rect x="420" y="547" width="12" height="12" fill="#f7816644" stroke="#f78166"/>
  <text x="438" y="558" fill="#8b949e" font-size="10">Monitoring</text>
  <rect x="510" y="547" width="12" height="12" fill="#58a6ff44" stroke="#58a6ff"/>
  <text x="528" y="558" fill="#8b949e" font-size="10">Infrastructure</text>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>