version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://claimcast:claimcast@db:5432/claimcast
      MODEL_VERSION: "1.0.0"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claimcast
      POSTGRES_PASSWORD: claimcast
      POSTGRES_DB: claimcast
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimcast"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
