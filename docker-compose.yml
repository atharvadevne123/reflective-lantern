version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://wattguard:wattguard@db:5432/wattguard
      - MODEL_PATH=/app/model.joblib
      - ANOMALY_MODEL_PATH=/app/anomaly_model.joblib
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_data:/app
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wattguard
      POSTGRES_PASSWORD: wattguard
      POSTGRES_DB: wattguard
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  model_data:
