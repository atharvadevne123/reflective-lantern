version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://voltcast:voltcast@db:5432/voltcast
      - MODEL_PATH=/app/volt_cast_model.joblib
      - METRICS_PATH=/app/volt_cast_metrics.json
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - model_data:/app/models

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: voltcast
      POSTGRES_PASSWORD: voltcast
      POSTGRES_DB: voltcast
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltcast"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  model_data:
