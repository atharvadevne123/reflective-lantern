version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://logistics:logistics@db:5432/logistics_flow
      - MODEL_PATH=/app/model.joblib
      - FEATURE_PIPELINE_PATH=/app/feature_pipeline.joblib
      - METRICS_PATH=/app/metrics.json
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_data:/app/models

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: logistics_flow
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics_flow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  model_data:
