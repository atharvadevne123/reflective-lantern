name: Ticket-Oracle CI

on:
  push:
    branches:
      - innovation/ticket-oracle
    paths:
      - "ticket-oracle/**"
  pull_request:
    branches:
      - main
    paths:
      - "ticket-oracle/**"

defaults:
  run:
    working-directory: ticket-oracle

jobs:
  lint:
    name: Ruff lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ticket-oracle/requirements.txt
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ticket-oracle/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short 2>&1 | tail -60
        env:
          DATABASE_URL: sqlite:///./test_ticket_oracle.db
          MODEL_DIR: /tmp/ticket_oracle_models_ci

  wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build --sdist --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: ticket-oracle-wheel
          path: ticket-oracle/dist/
