version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ticketoracle:ticketoracle@db:5432/ticketoracle
      MODEL_DIR: /app/models
      MODEL_VERSION: "1.0.0"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_data:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ticketoracle
      POSTGRES_PASSWORD: ticketoracle
      POSTGRES_DB: ticketoracle
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketoracle"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  model_data:
