[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-oracle"
version = "1.0.0"
description = "IT helpdesk ticket priority classification and SLA breach prediction API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reflective Lantern", email = "devneatharva@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.30",
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "joblib>=1.4.2",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0", "httpx>=0.27.0", "ruff>=0.5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "pipelines*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
