[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cyber-sentinel"
version = "1.0.0"
description = "Real-time network intrusion detection API using XGBoost-LightGBM-RF ensemble"
authors = [{name = "Atharva Devne", email = "devneatharva@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["cybersecurity", "intrusion-detection", "machine-learning", "fastapi", "xgboost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "sqlalchemy>=2.0.0,<3",
    "pydantic>=2.6.0,<3",
    "xgboost>=2.1.0,<4",
    "lightgbm>=4.4.0,<5",
    "scikit-learn>=1.5.0,<2",
    "numpy>=1.26.0,<3",
    "scipy>=1.13.0,<2",
    "pandas>=2.1.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27.0,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3.7,<5",
    "sqlalchemy[mypy]>=2.0.0,<3",
]

[project.urls]
Repository = "https://github.com/atharvadevne123/Cyber-Sentinel"
Issues = "https://github.com/atharvadevne123/Cyber-Sentinel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "pipelines*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "pipelines/*", "scripts/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]
fail_under = 50

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = false
