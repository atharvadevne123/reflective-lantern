version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cyber:sentinel@postgres:5432/cybersentinel
      MODEL_PATH: /tmp/cyber_sentinel_model.pkl
      LABEL_ENCODER_PATH: /tmp/cyber_sentinel_le.pkl
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyber
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: cybersentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber -d cybersentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
