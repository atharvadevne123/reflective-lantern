[mypy]
python_version = 3.11
strict = True
ignore_missing_imports = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True

# Staged Cyber-Sentinel app code awaiting transfer to its own repository.
# It carries its own tooling config; keep strict checks scoped to the
# Reflective Lantern core (config/, automation scripts).
[mypy-app.*]
ignore_errors = True

[mypy-scripts.generate_diagram]
ignore_errors = True

[mypy-scripts.seed_data]
ignore_errors = True

[mypy-scripts.train_model]
ignore_errors = True

[mypy-notion_client.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True
